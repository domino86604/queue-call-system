<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domino's - 준비완료</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Oswald:wght@700;900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #E31837;
      --blue: #006491;
      --dark: #00243F;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--dark);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── 헤더 ── */
    header {
      background: var(--red);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 48px;
      height: 115px;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 35%;
      background: var(--blue);
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0% 100%);
    }

    .header-right {
      z-index: 2;
      text-align: center;
      color: #fff;
    }

    .ready-label {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .ready-sub {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 4px;
    }

    /* ── 메인 ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 40px 16px;
      gap: 14px;
      overflow: hidden;
    }

    .info-banner {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      text-align: center;
      padding: 10px;
      font-size: clamp(14px, 1.6vw, 22px);
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .grid-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px 18px;
      width: 100%;
      max-width: 1200px;
      transition: max-width 0.25s ease-out; /* 그리드 크기 변화 부드럽게 */
    }

    .number-cell {
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: 0.06em;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease-out; /* 폰트 및 패딩 크기 전환 부드럽게 */
    }

    /* 대기번호 개수에 따른 동적 크기 제어 클래스 (폰트 확대 버전) */
    /* 1개: 화면을 꽉 채우는 가장 거대한 크기 (기존 대비 20% 축소) */
    .number-cell.size-1 {
      font-size: clamp(88px, 17vw, 255px);
      padding: 48px 20px;
      border-radius: 28px;
    }
    .number-cell.size-1::before {
      height: 10px;
    }

    /* 2개: 여전히 매우 크게 표시 */
    .number-cell.size-2 {
      font-size: clamp(90px, 14vw, 220px);
      padding: 45px 18px;
      border-radius: 20px;
    }
    .number-cell.size-2::before {
      height: 9px;
    }

    /* 3~4개: 화면 정렬에 알맞은 큼직한 크기 */
    .number-cell.size-3-4 {
      font-size: clamp(65px, 9.5vw, 150px);
      padding: 32px 12px;
      border-radius: 16px;
    }
    .number-cell.size-3-4::before {
      height: 7px;
    }

    /* 5~10개: 적당히 공간을 맞추는 중간 크기 */
    .number-cell.size-5-10 {
      font-size: clamp(45px, 6vw, 95px);
      padding: 22px 8px;
    }
    .number-cell.size-5-10::before {
      height: 5px;
    }

    /* 11개 이상: 촘촘하게 보여주는 작은 크기 */
    .number-cell.size-many {
      font-size: clamp(32px, 4.5vw, 68px);
      padding: 14px 6px;
    }
    .number-cell.size-many::before {
      height: 4px;
    }

    .number-cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: var(--red);
    }

    .number-cell.latest {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 24px rgba(227, 24, 55, 0.5);
      animation: popIn 0.35s ease-out, glow 2s ease-in-out infinite;
    }

    .number-cell.latest::before {
      background: rgba(255, 255, 255, 0.3);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.75) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 4px 24px rgba(227, 24, 55, 0.4);
      }

      50% {
        box-shadow: 0 4px 40px rgba(227, 24, 55, 0.8);
      }
    }

    .empty-state {
      text-align: center;
      color: rgba(255, 255, 255, 0.25);
      grid-column: span 5;
      padding: 60px 0;
    }

    .empty-state .icon {
      font-size: 80px;
      display: block;
      margin-bottom: 20px;
    }

    .empty-state p {
      font-size: 28px;
      font-weight: 700;
    }

    /* ── 푸터 ── */
    footer {
      background: var(--blue);
      flex-shrink: 0;
      padding: 10px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .footer-right {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    .count-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 14px;
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-right">
      <div class="ready-label">🍕 준비완료</div>
    </div>
  </header>

  <main>
    <div class="info-banner">
      📢 &nbsp; 아래 화면에 번호(연락처 뒷자리)가 표시되면 카운터에서 수령해 주세요
    </div>
    <div class="grid-wrap">
      <div class="number-grid" id="number-grid">
        <div class="empty-state" style="grid-column:span 5">
          <span class="icon">🍕</span>
          <p>현재 준비된 주문이 없습니다</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <div class="live-dot"></div>
      <span>실시간 연결 중</span>
    </div>
    <div class="count-badge" id="count-badge">대기 0건</div>
    <div class="footer-right"></div>
  </footer>

  <audio id="chimeSound" src="/static/chime2.wav" preload="auto"></audio>
  <div id="soundOverlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; cursor:pointer;" onclick="initSound()">
    <div style="font-size:80px; margin-bottom:20px;">🔊</div>
    <h2 style="font-size:36px; margin-bottom:12px; font-family:'Noto Sans KR', sans-serif;">화면을 한 번 터치해주세요</h2>
    <p style="font-size:20px; color:rgba(255,255,255,0.7); font-family:'Noto Sans KR', sans-serif;">(알림음과 음성안내 재생을 위해 필요합니다)</p>
  </div>

  <script>
    const socket = io();
    let prevQueueLength = 0;
    let soundEnabled = false;
    let audioCtx = null;

    // 밝고 생동감 있는 한국어 음성 선택
    // 우선순위: 여성 음성(Yuna/female) → 첫 번째 한국어 음성 → null(시스템 기본값)
    function getPreferredVoice() {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang.startsWith('ko') && /yuna|female|여성/i.test(v.name))
          || voices.find(v => v.lang.startsWith('ko'))
          || null;
    }

    // 블루투스 스피커 깨우기 함수 (무음 버퍼 재생)
    function playSilentBuffer() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) throw new Error("Web Audio API not supported");
      
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const silentBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const silentSrc = audioCtx.createBufferSource();
      silentSrc.buffer = silentBuf;
      silentSrc.connect(audioCtx.destination);
      silentSrc.start();
      console.log("Silent buffer played to wake speaker.");
    }

    function initSound() {
      const audio = document.getElementById('chimeSound');

      // 전역 AudioContext 초기화
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioCtx = new AudioCtx();
        }
      } catch (e) {
        console.warn("AudioContext 초기화 실패:", e);
      }

      // 모바일 기기 정책 우회를 위해 음성 합성 엔진 초기화
      // getVoices()는 비동기로 로드되므로 onvoiceschanged 이후에 사용 가능
      speechSynthesis.onvoiceschanged = () => { speechSynthesis.onvoiceschanged = null; };
      const initUtterance = new SpeechSynthesisUtterance('');
      speechSynthesis.speak(initUtterance);

      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        soundEnabled = true;
        document.getElementById('soundOverlay').style.display = 'none';
      }).catch(err => {
        console.error("Audio init error:", err);
      });
    }

    // 4자리 숫자가 완성되었을 때 선제적으로 스피커 깨우기
    socket.on('wake_speaker', () => {
      if (soundEnabled) {
        try {
          playSilentBuffer();
        } catch (e) {
          console.warn("wake_speaker 중 스피커 깨우기 실패:", e);
        }
      }
    });

    socket.on('queue_update', ({ queue }) => {
      // 새로운 번호가 추가되었을 때 소리 및 음성 재생
      if (soundEnabled && queue.length > prevQueueLength) {
        const newNumber = queue[queue.length - 1];
        const audio = document.getElementById('chimeSound');

        // 기존 핸들러 완전 제거 후 currentTime 리셋
        // (onended가 남아있는 상태에서 currentTime=0 설정 시 Windows에서 ended 이벤트 중복 발화 가능)
        audio.onended = null;
        audio.currentTime = 0;

        // 차임벨 종료 후 TTS 음성 출력
        // { once: true } → 이벤트를 정확히 한 번만 수신 후 자동 제거 (중복 재생 원천 차단)
        const ttsHandler = () => {
          // PC TTS 엔진이 '6번'을 '여섯번' 등 고유어로 읽는 현상 방지 (숫자를 명시적 한글 발음으로 변환)
          // 쉼표(,)를 추가하여 "1111" 처럼 같은 숫자가 반복될 때 너무 빠르게 뭉개져서 읽히는 현상 방지
          const numMap = {'0':'영', '1':'일', '2':'이', '3':'삼', '4':'사', '5':'오', '6':'육', '7':'칠', '8':'팔', '9':'구'};
          const hangulNumber = newNumber.split('').map(n => numMap[n] || n).join(', ');

          const voice = getPreferredVoice();

          // 공통 utterance 설정 헬퍼
          const makeUtterance = (text, rate) => {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ko-KR';
            u.rate = rate;
            u.pitch = 1.2;
            if (voice) u.voice = voice;
            return u;
          };

          // 숫자와 "번 고객님"을 하나의 utterance로 합쳐 발화 간 자동 pause 제거
          // (utterance를 분리하면 브라우저가 사이에 gap을 자동 삽입)
          speechSynthesis.speak(makeUtterance(hangulNumber + ' 번 고객님', 1.0));           // 1번째
          speechSynthesis.speak(makeUtterance(hangulNumber + ' 번 고객님, 주문하신 피자 나왔습니다.', 1.0)); // 2번째
        };
        audio.addEventListener('ended', ttsHandler, { once: true });

        // ── 블루투스 스피커 깨우기 및 딜레이 후 재생 ──
        let hasWebAudio = true;
        try {
          playSilentBuffer();
        } catch (wakeErr) {
          hasWebAudio = false;
          console.warn("Web Audio wake-up 실패, 폴백 모드로 진행:", wakeErr);
        }

        // 선제적으로 깨어났을 것이므로, Web Audio 성공 시 200ms만 대기 후 재생 (실패 시 폴백 400ms)
        const playDelay = hasWebAudio ? 200 : 400;
        setTimeout(() => {
          audio.play().catch(e => {
            console.error("Play error:", e);
            audio.removeEventListener('ended', ttsHandler); // 재생 실패 시 리스너 제거
          });
        }, playDelay);
      }
      prevQueueLength = queue.length;
      render(queue);
    });

    function render(queue) {
      const grid = document.getElementById('number-grid');
      document.getElementById('count-badge').textContent = `대기 ${queue.length}건`;

      if (queue.length === 0) {
        grid.style.gridTemplateColumns = '1fr';
        grid.style.maxWidth = '1200px';
        grid.innerHTML = `
          <div class="empty-state">
            <span class="icon">🍕</span>
            <p>현재 준비된 주문이 없습니다</p>
          </div>`;
        return;
      }

      const count = queue.length;
      let sizeClass = '';
      let cols = 5;
      let maxWidth = '1200px';

      // 대기번호 개수에 따라 최적의 열(column) 배치(최대 4열)와 크기 클래스 및 폭 동적 계산
      if (count === 1) {
        cols = 1;
        sizeClass = 'size-1';
        maxWidth = '700px';
      } else if (count === 2) {
        cols = 2;
        sizeClass = 'size-2';
        maxWidth = '1100px';
      } else if (count === 3) {
        cols = 3;
        sizeClass = 'size-3-4';
        maxWidth = '1350px';
      } else if (count === 4) {
        cols = 4;
        sizeClass = 'size-3-4';
        maxWidth = '1450px';
      } else if (count === 5) {
        cols = 4; // 4열 배치 (2행에 1개)
        sizeClass = 'size-5-10';
        maxWidth = '1450px';
      } else if (count === 6) {
        cols = 3; // 3열 * 2행으로 꽉 찬 배치
        sizeClass = 'size-5-10';
        maxWidth = '1300px';
      } else if (count === 7 || count === 8) {
        cols = 4; // 4열 * 2행
        sizeClass = 'size-5-10';
        maxWidth = '1450px';
      } else {
        cols = 4; // 9개 이상은 4열 고정
        sizeClass = count <= 10 ? 'size-5-10' : 'size-many';
        maxWidth = '1450px';
      }

      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.maxWidth = maxWidth;

      grid.innerHTML = queue.map((num, idx) => {
        const latest = idx === queue.length - 1;
        return `<div class="number-cell ${sizeClass}${latest ? ' latest' : ''}">${num}</div>`;
      }).join('');
    }
  </script>
</body>

</html>
